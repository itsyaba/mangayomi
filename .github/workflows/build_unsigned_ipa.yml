name: Build unsigned IPA

# Unsigned release build of this branch, for sideloading with SideStore,
# AltStore or Sideloadly (they sign it with your own Apple ID).
on:
  push:
    branches: [ios-build]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-ios-ipa:
    permissions:
      contents: write
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          architecture: x64

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-on-failure: true

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Flutter pub get
        run: flutter pub get

      - name: Build iOS
        run: |
          flutter build ios --release --no-codesign
          mkdir -p build/ios/iphoneos/Payload
          mv build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -qr Mangayomi-unsigned.ipa Payload

      - name: Upload artifact iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mangayomi-unsigned-ios
          path: build/ios/iphoneos/Mangayomi-unsigned.ipa

      # A fixed release, so the newest IPA is always at the same link
      - name: Publish to the ipa-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ipa-latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create ipa-latest build/ios/iphoneos/Mangayomi-unsigned.ipa \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Mangayomi unsigned IPA ($(git rev-parse --short HEAD))" \
            --notes "Unsigned build of ${GITHUB_REF_NAME} at ${GITHUB_SHA}. Sideload with SideStore, AltStore or Sideloadly."
